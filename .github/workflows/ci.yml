name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies (no torch / strands-decider)
        run: |
          python -m pip install --upgrade pip
          python -m pip install boto3 botocore python-dotenv python-nmap requests strands-agents
      - name: Run mock unit tests
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python -m unittest tests/test_unit.py tests/test_allowlist.py tests/test_guardrails.py
