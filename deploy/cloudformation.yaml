AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation stack for Strands Decider 2B Agent and Attack Surface Console on a single EC2 instance'

Parameters:
  InstanceType:
    Type: String
    Default: t3.xlarge
    AllowedValues:
      - t3.xlarge   # Cheap CPU: 4 vCPU, 16GB RAM (~$0.1664/hr)
      - c6i.xlarge  # Compute CPU: 4 vCPU, 8GB RAM (~$0.17/hr)
      - g4dn.xlarge # GPU: 4 vCPU, 16GB RAM, NVIDIA T4 (~$0.526/hr)
    Description: EC2 Instance Type. Default t3.xlarge is recommended for cheap CPU demo.

  AdminCIDR:
    Type: String
    Default: 127.0.0.1/32
    Description: CIDR block allowed SSH access (e.g. your IP: 203.0.113.50/32).

Resources:
  # ---------------------------------------------------------------------------
  # 1. Least Privilege IAM Role for Amazon Bedrock
  # ---------------------------------------------------------------------------
  EC2BedrockRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: strands-security-agent-cf-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: BedrockFoundationModelInvokeOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BedrockInvokeModels
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - 'arn:aws:bedrock:*::foundation-model/amazon.nova-micro-v1:0'
                  - 'arn:aws:bedrock:*::foundation-model/amazon.nova-lite-v1:0'
                  - 'arn:aws:bedrock:*::foundation-model/anthropic.claude-*'
                  - 'arn:aws:bedrock:*::foundation-model/us.anthropic.claude-*'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: strands-security-agent-cf-profile
      Roles:
        - !Ref EC2BedrockRole

  # ---------------------------------------------------------------------------
  # 2. Hardened Security Group
  # ---------------------------------------------------------------------------
  AgentSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Strands Agent dashboard (Port 8099 closed externally)
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Public HTTPS access
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Public HTTP redirect / ACME challenge
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          CidrIp: 0.0.0.0/0
          Description: Streamlit direct port
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCIDR
          Description: SSH restricted to admin IP
      # NOTE: Port 8099 is explicitly NOT open.
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Outbound access for OSINT, NVD, and Bedrock

  # ---------------------------------------------------------------------------
  # 3. EC2 Host Instance
  # ---------------------------------------------------------------------------
  AgentEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !Ref AgentSecurityGroup
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 40
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: Strands-Decider-Agent-Host
        - Key: Project
          Value: Strands-Decider-Hackathon

Outputs:
  PublicIP:
    Description: Public IP of the deployed instance
    Value: !GetAtt AgentEC2Instance.PublicIp

  DashboardURL:
    Description: Direct URL to the Streamlit console
    Value: !Sub 'http://${AgentEC2Instance.PublicIp}:8501'
