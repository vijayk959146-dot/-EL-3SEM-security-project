# ========================================================
# NGINX DEFENSIVE SECURITY HARDENING FOR ALL DETECTED FINDINGS
# Place in /etc/nginx/conf.d/security.conf or inside server { }
# ========================================================

# 1. Information Disclosure Mitigation
server_tokens off;

# 2. Strict Transport Security (HSTS - 2 Years with Subdomains and Preload)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# 3. Content Security Policy (CSP - Neutralizes XSS and unauthorized scripts)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

# 4. Anti-Clickjacking & MIME Protection
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# 5. Drop Unrecognized or Spoofed Host Headers (CVE-2001-0535)
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    return 444; # Closes connection immediately without responding
}
